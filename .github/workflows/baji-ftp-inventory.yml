name: BAJI FTP theme storage inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/baji-ftp-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare FTP files with checked-out theme (read only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,os,pathlib
          f=ftplib.FTP()
          f.connect(os.environ["FTP_SERVER"],21,timeout=25)
          f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          f.voidcmd("TYPE I")
          # Avoid scanning outside theme; limit traversal and skip invisible paths.
          queue=["assets"]
          files=[]
          seen=set()
          while queue and len(files)<3500:
              directory=queue.pop(0)
              if directory in seen:continue
              seen.add(directory)
              if directory.count("/")>5: continue
              try:
                  entries=list(f.mlsd(directory))
              except ftplib.all_errors as e:
                  print("LIST_FAILED",directory,str(e)[:70]);continue
              for name,attrs in entries:
                  if name in (".","..") or name.startswith("."):continue
                  path=directory+"/"+name
                  if attrs.get("type")=="dir":
                      queue.append(path)
                  elif attrs.get("type")=="file":
                      files.append((int(attrs.get("size",0)),path))
          f.quit()
          extra=[(size,path) for size,path in files if not pathlib.Path(path).is_file()]
          print("FILES",len(files),"BYTES",sum(s for s,_ in files))
          print("UNTRACKED_OR_MISSING_IN_CURRENT_SOURCE",len(extra),"BYTES",sum(s for s,_ in extra))
          for size,path in sorted(extra,reverse=True)[:45]:
              print("FTP_ONLY",size,path)
          print("LARGEST_FILES")
          for size,path in sorted(files,reverse=True)[:20]:
              print("SIZE",size,path)
          PY
