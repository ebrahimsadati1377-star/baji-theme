name: Deploy BajiStyle theme

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: baji-theme-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy theme via existing FTP production route
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/documentation/**
            **/memory/**
            CLAUDE.md
            package.json
            package-lock.json
            webpack.config.js
            tailwind.config.js
      - name: Verify homepage
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 25 https://bajistyle.ir/ || true)"
            if [[ "$code" = "200" ]]; then
              echo "Homepage is reachable after deploy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Homepage verification failed"
          exit 1
