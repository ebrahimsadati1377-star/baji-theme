name: Emergency PHP recovery deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baji-theme-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery PHP
        run: |
          set -euo pipefail
          php -l inc/order-attribution-recovered.php >/dev/null
          php -l functions.php >/dev/null

      - name: Bypass damaged FTP file
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          upload() {
            file="$1"
            echo "Uploading $file"
            curl --fail --show-error --silent \
              --ftp-create-dirs \
              --retry 6 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              -T "$file" "ftp://$FTP_SERVER/$file"
          }

          # Do not touch inc/order-attribution.php: the FTP server returns 451 for that path.
          upload inc/order-attribution-recovered.php
          upload functions.php

      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 25 https://bajistyle.ir/ || true)"
            echo "homepage=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
