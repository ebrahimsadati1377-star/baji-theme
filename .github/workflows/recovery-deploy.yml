name: Emergency PHP recovery deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baji-theme-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery PHP
        run: |
          set -euo pipefail
          php -l inc/order-attribution-recovered.php >/dev/null
          php -l inc/template-tags.php >/dev/null
          php -l functions.php >/dev/null
          php -l front-page.php >/dev/null

      - name: Free safe theme space and restore PHP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os

          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])

          disposable = "assets/webfonts/fa-duotone-thin-100.woff2"
          try:
              ftp.delete(disposable)
              print(f"FREED {disposable}")
          except ftplib.all_errors as exc:
              print(f"SKIP_DELETE {disposable}: {exc}")

          for path in ("inc/order-attribution-recovered.php", "inc/template-tags.php", "functions.php", "front-page.php"):
              with open(path, "rb") as fh:
                  ftp.storbinary("STOR " + path, fh, blocksize=65536)
              print("UPLOADED", path)

          ftp.quit()
          PY

      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 25 https://bajistyle.ir/ || true)"
            echo "homepage=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
