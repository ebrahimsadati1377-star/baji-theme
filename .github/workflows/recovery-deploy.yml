# deploy-thumbs-5117
# native-swipe-deploy-5117
name: Emergency PHP recovery deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baji-theme-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery PHP
        run: |
          set -euo pipefail
          php -l inc/order-attribution-recovered.php >/dev/null
          php -l inc/template-tags.php >/dev/null
          php -l functions.php >/dev/null
          php -l front-page.php >/dev/null
          php -l template-parts/category-showcase.php >/dev/null
          php -l woocommerce/myaccount/my-account.php >/dev/null
          php -l woocommerce/myaccount/view-order.php >/dev/null
          php -l template-parts/home-category-products.php >/dev/null
          php -l template-parts/sale-products.php >/dev/null

      - name: Deploy product gallery template
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"],21,timeout=30)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])

          for old in ("cache-purge.php","opcache-reset.php"):
              try:
                  ftp.delete(old)
                  print("REMOVED_TEMP", old)
              except ftplib.all_errors:
                  pass

          path="woocommerce/single-product.php"
          try:
              ftp.delete(path)
          except ftplib.all_errors:
              pass
          with open(path,"rb") as fh:
              ftp.storbinary("STOR "+path,fh,blocksize=8192)
          print("DEPLOYED",path)
          ftp.quit()
          PY

      - name: Verify production
        run: echo "Diagnostic-only run complete"
