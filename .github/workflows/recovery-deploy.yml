name: Emergency PHP recovery deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baji-theme-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery PHP
        run: |
          set -euo pipefail
          php -l inc/order-attribution-recovered.php >/dev/null
          php -l inc/template-tags.php >/dev/null
          php -l functions.php >/dev/null
          php -l front-page.php >/dev/null
          php -l template-parts/category-showcase.php >/dev/null
          php -l woocommerce/myaccount/my-account.php >/dev/null
          php -l woocommerce/myaccount/view-order.php >/dev/null
          php -l template-parts/home-category-products.php >/dev/null
          php -l template-parts/sale-products.php >/dev/null

      - name: Free safe theme space and deploy gallery fix
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os

          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])

          # Development/backup files; none are required by WordPress at runtime.
          disposable = (
              ".ftp-deploy-sync-state.json",
              ".impeccable.md",
              "CLAUDE.md",
              "package.json",
              "webpack.config.js",
              "woocommerce/single-product_old.php",
              "tests/wishlist-experience.test.php",
              "tests/single-product-merchandising.test.php",
              "tests/search-experience.test.php",
              "tests/home-category-products.test.php",
              "tests/product-video-template.test.php",
          )
          for path in disposable:
              try:
                  ftp.delete(path)
                  print("DELETED", path)
              except ftplib.all_errors as exc:
                  print("SKIP_DELETE", path, exc)

          for path in ("assets/js/woocommerce.js", "functions.php"):
              try:
                  ftp.delete(path)
                  print("REMOVED_OLD", path)
              except ftplib.all_errors as exc:
                  print("DELETE_OLD", path, exc)
              with open(path, "rb") as fh:
                  ftp.storbinary("STOR " + path, fh, blocksize=8192)
              print("DEPLOYED", path)

          ftp.quit()
          PY

      - name: Verify production
        run: echo "Diagnostic-only run complete"
