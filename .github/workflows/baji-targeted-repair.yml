name: BAJI targeted theme repair with FTP backup

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/main.js'
      - 'assets/css/custom.css'
      - 'functions.php'
      - 'assets/vendor/swiper/**'
      - '.github/workflows/baji-targeted-repair.yml'
      - '.github/scripts/baji-targeted-repair.py'
  workflow_dispatch:

concurrency:
  group: baji-theme-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate updated code
        run: |
          set -euo pipefail
          php -l functions.php
          php -l tests/product-slider-dependency.test.php
          php tests/product-slider-dependency.test.php
          node --check assets/js/main.js
          test -s assets/webfonts/fa-regular-400.woff2
          test -s assets/images/banner-instagram2.webp
          test -s assets/images/banner-bale2.webp

      - name: Back up original files and deploy only selected repairs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/baji-targeted-repair.py

      - name: Preserve original production files for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baji-before-targeted-repair-${{ github.run_id }}
          path: .baji-deploy-backup/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
