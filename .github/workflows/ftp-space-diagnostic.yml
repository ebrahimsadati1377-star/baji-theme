name: FTP space diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftp-space-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FTP space and paths
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"],21,timeout=30)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          print("PWD", ftp.pwd())
          for cmd in ("STAT","SITE QUOTA","SITE DF"):
              try:
                  print(cmd, ftp.sendcmd(cmd))
              except Exception as e:
                  print(cmd, "ERR", repr(e))
          for p in (".","..","../..","../../..","../../../uploads","../../uploads","../uploads","../../../cache","../../cache","../cache"):
              try:
                  cur=ftp.pwd(); ftp.cwd(p)
                  print("DIR",p,"=>",ftp.pwd())
                  items=[]
                  ftp.retrlines("LIST",items.append)
                  for line in items[:80]: print(" ",line)
                  ftp.cwd(cur)
              except Exception as e:
                  print("DIR_ERR",p,repr(e))
          ftp.quit()
          PY
