name: BAJI FTP read-only storage audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/baji-ftp-readonly-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read FTP quota and missing asset state without writing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,os
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"],21,timeout=25)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.voidcmd("TYPE I")
          for cmd in ("SITE QUOTA","SITE DF","SITE DISK","STAT"):
              try:
                  reply=ftp.sendcmd(cmd)
                  # server banners can contain usernames; keep only numeric/status signals
                  print("SERVER_COMMAND",cmd,"STATUS",reply[:3],"TEXT",reply[4:160].replace(os.environ["FTP_USERNAME"],"[account]"))
              except ftplib.all_errors as exc:
                  print("SERVER_COMMAND",cmd,"UNSUPPORTED",type(exc).__name__,str(exc)[:100])
          for name in ("functions.php","front-page.php","assets/js/main.js","assets/css/custom.css","assets/images/banner-instagram2.webp","assets/images/banner-bale2.webp","assets/webfonts/fa-regular-400.woff2","assets/vendor/swiper/swiper-bundle.min.js"):
              try: print("REMOTE_FILE",name,"SIZE",ftp.size(name))
              except ftplib.all_errors as exc:print("REMOTE_FILE",name,"MISSING_OR_ERROR",str(exc)[:90])
          ftp.quit()
          PY
