name: BAJI FTP temporary write capacity probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/baji-ftp-capacity-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test temporary FTP uploads and clean up
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,os,io,secrets
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"],21,timeout=25)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.voidcmd("TYPE I")
          for amount in (1024, 32768, 131072):
              name="assets/.baji-capacity-"+secrets.token_hex(9)+".tmp"
              try:
                  with io.BytesIO(b'x'*amount) as payload:
                      ftp.storbinary("STOR "+name,payload,blocksize=4096)
                  print("UPLOAD_TEST_OK",amount,ftp.size(name))
              except ftplib.all_errors as e:
                  print("UPLOAD_TEST_FAILED",amount,type(e).__name__,str(e))
              finally:
                  try: ftp.delete(name); print("CLEANED_TEMP_FILE",amount)
                  except ftplib.all_errors as e: print("CLEANUP",amount,str(e)[:120])
          ftp.quit()
          PY
