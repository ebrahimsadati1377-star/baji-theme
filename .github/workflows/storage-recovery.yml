name: One-time BAJI storage recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Free thumbnails from known unattached test media
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os, posixpath

          server = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          base = "baji-product-image-5-20260920-225423-489e4d"
          original = base + ".png"

          ftp = ftplib.FTP()
          ftp.connect(server, 21, timeout=30)
          ftp.login(user, password)
          origin = ftp.pwd()

          candidates = [
              "../../uploads/2026/09",
              "../../../uploads/2026/09",
              "../../../../wp-content/uploads/2026/09",
              "../uploads/2026/09",
              "uploads/2026/09",
          ]

          found = False
          freed = 0
          deleted = 0

          for path in candidates:
              try:
                  ftp.cwd(origin)
                  ftp.cwd(path)
                  names = ftp.nlst()
                  matches = [os.path.basename(x) for x in names if os.path.basename(x).startswith(base)]
                  if not matches:
                      continue
                  found = True
                  for name in matches:
                      if name == original:
                          continue
                      try:
                          size = ftp.size(name) or 0
                      except Exception:
                          size = 0
                      ftp.delete(name)
                      freed += int(size)
                      deleted += 1
                  print(f"RECOVERY_OK deleted={deleted} freed_bytes={freed}")
                  break
              except ftplib.all_errors:
                  continue

          try:
              ftp.cwd(origin)
          except Exception:
              pass
          ftp.quit()

          if not found:
              print("RECOVERY_NO_ACCESS_OR_MATCH")
          PY
